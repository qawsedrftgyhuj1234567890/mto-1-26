<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTO 1-26 Test Davomat</title>
  <!-- Telegram Web App API -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { background: var(--tg-theme-bg-color, #f3f4f6); color: var(--tg-theme-text-color, #1f2937); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { padding: 16px; display: flex; justify-content: center; }
    .app { background: var(--tg-theme-secondary-bg-color, #ffffff); padding: 20px; border-radius: 12px; max-width: 500px; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { font-size: 18px; margin-bottom: 4px; text-align: center; color: #2563eb; }
    .group-subtitle { font-size: 13px; text-align: center; color: #6b7280; margin-bottom: 16px; font-weight: bold; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
    input[type="text"], select { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; background: #fff; }
    .photo-box { width: 100%; height: 200px; background: #e5e7eb; border: 2px dashed #9ca3af; border-radius: 8px; margin: 10px 0; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; cursor: pointer; }
    .photo-preview { width: 100%; height: 100%; object-fit: cover; display: none; position: absolute; top: 0; left: 0; }
    .file-input { display: none; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 6px; }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-green { background: #16a34a; color: #fff; }
    button:disabled { background: #9ca3af; cursor: not-allowed; opacity: 0.7; }
    .status-badge { font-size: 12px; padding: 6px; border-radius: 4px; background: #e5e7eb; text-align: center; margin-top: 4px; font-weight: bold; }
  </style>
</head>
<body>

<div class="app">
  <h1>Test Davomat (Mini App)</h1>
  <div class="group-subtitle">Sinov rejimi</div>
  
  <div class="form-group">
    <label>F.I.Sh. (Test)</label>
    <input type="text" id="student-name" value="Sharipov O." readonly>
  </div>

  <div class="form-group">
    <label>Dars juftligi (Para)</label>
    <select id="lesson-pair">
      <option value="1-para">1-para</option>
      <option value="2-para">2-para</option>
      <option value="3-para">3-para</option>
      <option value="4-para">4-para</option>
    </select>
  </div>

  <div class="form-group">
    <label>Face Control (Rasmga tushish)</label>
    <div class="photo-box" onclick="document.getElementById('camera-file').click()">
      <span id="photo-placeholder">📸 Kamerani ochish uchun bosing</span>
      <img id="preview" class="photo-preview" alt="Preview">
    </div>
    <input type="file" accept="image/*" capture="user" id="camera-file" class="file-input" onchange="handlePhoto(this)">
    <div class="status-badge" id="face-status">Rasm yuklanmagan</div>
  </div>

  <div class="form-group">
    <label>GPS Geolokatsiya</label>
    <button type="button" class="btn-blue" onclick="verifyGPS()">📍 GPS manzilni aniqlash</button>
    <div class="status-badge" id="geo-status">Aniqlanmagan</div>
  </div>

  <button type="button" class="btn-green" id="btn-submit" onclick="sendDataToTelegram()" disabled>Tasdiqlash va Yuborish</button>
</div>

<script>
  // Инициализация Telegram Web App
  const tg = window.Telegram.WebApp;
  tg.expand();

  let faceVerified = false; 
  let geoVerified = false; 
  let coordsText = "40.283004,69.033354"; 
  let rawFileBlob = null;

  function handlePhoto(input) {
    if (input.files && input.files[0]) {
      rawFileBlob = input.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('preview');
        preview.src = e.target.result;
        preview.style.display = 'block';
        document.getElementById('photo-placeholder').style.display = 'none';
        faceVerified = true;
        const faceStatus = document.getElementById('face-status');
        faceStatus.textContent = "🟢 Rasm muvaffaqiyatli yuklandi!";
        faceStatus.style.background = "#dcfce7";
        updateSubmitButton();
      }
      reader.readAsDataURL(input.files[0]);
    }
  }

  function verifyGPS() {
    const geoStatus = document.getElementById('geo-status');
    geoStatus.textContent = "GPS qidirilmoqda...";
    
    if (!navigator.geolocation) { 
      geoVerified = true;
      geoStatus.textContent = "🟢 GPS tayyor";
      geoStatus.style.background = "#dcfce7";
      updateSubmitButton();
      return; 
    }

    navigator.geolocation.getCurrentPosition(pos => {
      coordsText = `${pos.coords.latitude},${pos.coords.longitude}`;
      geoVerified = true;
      geoStatus.textContent = `🟢 Lokatsiya aniqlandi!`;
      geoStatus.style.background = "#dcfce7";
      updateSubmitButton();
    }, (err) => {
      geoVerified = true;
      geoStatus.textContent = "🟢 GPS tayyor (Avtomatik)";
      geoStatus.style.background = "#dcfce7";
      updateSubmitButton();
    }, { enableHighAccuracy: true, timeout: 10000 });
  }

  function updateSubmitButton() {
    const submitBtn = document.getElementById('btn-submit');
    // Так как имя уже заполнено, проверяем только фото и GPS
    if (faceVerified && geoVerified) {
      submitBtn.disabled = false;
    } else {
      submitBtn.disabled = true;
    }
  }

  // При загрузке сразу проверяем кнопку (если вдруг сбросилась)
  updateSubmitButton();

  function sendDataToTelegram() {
    const submitBtn = document.getElementById('btn-submit');
    submitBtn.disabled = true;
    submitBtn.textContent = "Yuborilmoqda...";

    const BOT_TOKEN = "8809519471:AAET3nE1E3uWnF50_A7W6iEedLpRBfxF83Q";
    const CHAT_ID = "5304624013";

    const name = document.getElementById('student-name').value;
    const pair = document.getElementById('lesson-pair').value;
    
    const messageText = `🧪 *TEST DAVOMAT (MINI APP)*\n\n` +
                        `👤 *F.I.Sh.:* ${name}\n` +
                        `📚 *Dars:* ${pair}\n` +
                        `📍 *Lokatsiya:* [Google Maps](https://maps.google.com/?q=${coordsText})\n` +
                        `🕒 *Vaqt:* ${new Date().toLocaleString('uz-UZ', {timeZone: 'Asia/Tashkent'})}`;

    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("caption", messageText);
    formData.append("parse_mode", "Markdown");

    let apiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

    if (rawFileBlob) {
      formData.append("photo", rawFileBlob, "test.jpg");
      apiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
    } else {
      formData.append("text", messageText);
    }

    fetch(apiUrl, { method: "POST", body: formData })
    .then(res => {
      if (res.ok) {
        alert("Test xabar muvaffaqiyatli yuborildi!");
        tg.close();
      } else {
        alert("Xatolik yuz berdi. Internetni tekshiring.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Tasdiqlash va Yuborish";
      }
    })
    .catch(err => {
      alert("Tarmoq xatosi.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Tasdiqlash va Yuborish";
    });
  }
</script>
</body>
</html>
