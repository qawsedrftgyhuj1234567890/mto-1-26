<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTO 1-26 Davomati</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { background: var(--tg-theme-bg-color, #f3f4f6); color: var(--tg-theme-text-color, #1f2937); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { padding: 16px; display: flex; justify-content: center; }
    .app { background: var(--tg-theme-secondary-bg-color, #ffffff); padding: 20px; border-radius: 12px; max-width: 500px; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { font-size: 18px; margin-bottom: 4px; text-align: center; color: #2563eb; }
    .group-subtitle { font-size: 13px; text-align: center; color: #6b7280; margin-bottom: 16px; font-weight: bold; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
    select { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; background: #fff; }
    .photo-box { width: 100%; height: 220px; background: #e5e7eb; border: 2px dashed #9ca3af; border-radius: 8px; margin: 10px 0; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; cursor: pointer; }
    .photo-preview { width: 100%; height: 100%; object-fit: cover; display: none; position: absolute; top: 0; left: 0; z-index: 2; }
    .placeholder-text { color: #4b5563; z-index: 1; text-align: center; padding: 10px; font-size: 14px; font-weight: bold; }
    .file-input { display: none; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 6px; }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-green { background: #16a34a; color: #fff; }
    button:disabled { background: #9ca3af; cursor: not-allowed; opacity: 0.7; }
    .status-badge { font-size: 12px; padding: 6px; border-radius: 4px; background: #e5e7eb; text-align: center; margin-top: 4px; font-weight: bold; }
  </style>
</head>
<body>

<div class="app">
  <h1>1-son Texnikum Davomati</h1>
  <div class="group-subtitle">Guruh: MTO 1-26</div>
  
  <div class="form-group">
    <label>Talaba F.I.Sh.</label>
    <select id="student-name">
      <option value="">Talabani tanlang...</option>
      <option value="Abduqodirov Salmon">Abduqodirov S.</option>
      <option value="Abdurahmonov Behruzjon">Abdurahmonov B.</option>
      <option value="Abdusamatov Saidnurdixon">Abdusamatov S.</option>
      <option value="Ahmadiyorov Nurbek">Ahmadiyorov N.</option>
      <option value="Ahmadqulov Javohir">Ahmadqulov J.</option>
      <option value="Akramov Nodirbek">Akramov N.</option>
      <option value="Joniqulov Doniyor">Joniqulov D.</option>
      <option value="Kamoliddinov Amirxon">Kamoliddinov A.</option>
      <option value="Kamolov Muhammadjon">Kamolov M.</option>
      <option value="Meliboyev Samandar">Meliboyev S.</option>
      <option value="Murodqulov Jahongir">Murodqulov J.</option>
      <option value="Mustafoqulov Alisher">Mustafoqulov A.</option>
      <option value="Norbekov Shahriyor">Norbekov Sh.</option>
      <option value="Norbo‘tayev Qosimjon">Norbo‘tayev Q.</option>
      <option value="Qurbonboyev Noryigit">Qurbonboyev N.</option>
      <option value="Rayimjonov Umidjon">Rayimjonov U.</option>
      <option value="Safarboyev Behruz">Safarboyev B.</option>
      <option value="Safarboyev Boburjon">Safarboyev B.</option>
      <option value="Shermatov Anvar">Shermatov A.</option>
      <option value="Sulaymonov Shoxrux">Sulaymonov Sh.</option>
      <option value="Sultonov Ibrohim">Sultonov I.</option>
      <option value="Tilovbekov Sunnatullo">Tilovbekov S.</option>
      <option value="Tohirov Salohiddin">Tohirov S.</option>
      <option value="Tursunmurodov Shohjahon">Tursunmurodov Sh.</option>
      <option value="Umurqulov Ergashali">Umurqulov E.</option>
      <option value="Xamroqulov Ozodbek">Xamroqulov O.</option>
      <option value="Xolbo‘tayev Eldor">Xolbo‘tayev E.</option>
      <option value="Xudoyberdiyev Humoyun">Xudoyberdiyev H.</option>
      <option value="Xudoyberdiyev Sunnatbek">Xudoyberdiyev S.</option>
    </select>
  </div>

  <div class="form-group">
    <label>Dars juftligi (Para)</label>
    <select id="lesson-pair">
      <option value="1-para">1-para</option>
      <option value="2-para">2-para</option>
      <option value="3-para">3-para</option>
      <option value="4-para">4-para</option>
    </select>
  </div>

  <div class="form-group">
    <label>Face Control (Kameradan rasmga tushish)</label>
    <div class="photo-box" onclick="document.getElementById('camera-file').click()">
      <span class="placeholder-text" id="photo-placeholder">📸 Kamerani ochish uchun bosing</span>
      <img id="preview" class="photo-preview" alt="Preview">
    </div>
    <!-- Строгий вызов именно камеры без доступа к общей галерее -->
    <input type="file" accept="image/*" capture="user" id="camera-file" class="file-input" onchange="handlePhoto(this)">
    <div class="status-badge" id="face-status">Rasm yuklanmagan</div>
  </div>

  <div class="form-group">
    <label>GPS Geolokatsiya (Texnikum hududi)</label>
    <button type="button" class="btn-blue" onclick="verifyGPS()">📍 GPS manzilni tekshirish</button>
    <div class="status-badge" id="geo-status">Tekshirilmagan</div>
  </div>

  <button type="button" class="btn-green" id="btn-submit" onclick="sendDataToTelegram()" disabled>Tasdiqlash va Yuborish</button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  let faceVerified = false; 
  let geoVerified = false; 
  let coordsText = "40.283016,69.033260"; 
  let rawFileBlob = null;

  const TARGET_LAT = 40.283016;
  const TARGET_LON = 69.033260;
  const ALLOWED_RADIUS_METERS = 200; // 200 метр радиус

  function handlePhoto(input) {
    if (input.files && input.files[0]) {
      rawFileBlob = input.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('preview');
        preview.src = e.target.result;
        preview.style.display = 'block';
        document.getElementById('photo-placeholder').style.display = 'none';
        faceVerified = true;
        const faceStatus = document.getElementById('face-status');
        faceStatus.textContent = "🟢 Rasm muvaffaqiyatli olindi!";
        faceStatus.style.background = "#dcfce7";
        updateSubmitButton();
      }
      reader.readAsDataURL(input.files[0]);
    }
  }

  function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const φ1 = lat1 * Math.PI/180;
    const φ2 = lat2 * Math.PI/180;
    const Δφ = (lat2-lat1) * Math.PI/180;
    const Δλ = (lon2-lon1) * Math.PI/180;

    const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
              Math.cos(φ1) * Math.cos(φ2) *
              Math.sin(Δλ/2) * Math.sin(Δλ/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  function verifyGPS() {
    const geoStatus = document.getElementById('geo-status');
    geoStatus.textContent = "GPS tekshirilmoqda...";
    
    if (!navigator.geolocation) { 
      alert("Qurilmangiz GPS'ni qo'llab-quvvatlamaydi.");
      return; 
    }

    navigator.geolocation.getCurrentPosition(pos => {
      const userLat = pos.coords.latitude;
      const userLon = pos.coords.longitude;
      coordsText = `${userLat},${userLon}`;

      const distance = calculateDistance(userLat, userLon, TARGET_LAT, TARGET_LON);

      if (distance <= ALLOWED_RADIUS_METERS) {
        geoVerified = true;
        geoStatus.textContent = `🟢 Texnikum hududasidasiz (${Math.round(distance)}m)`;
        geoStatus.style.background = "#dcfce7";
      } else {
        geoVerified = false;
        geoStatus.textContent = `🔴 Hududdan tashqaridasiz (${Math.round(distance)}m)`;
        geoStatus.style.background = "#fee2e2";
        alert(`Diqqat! Siz texnikum hududidan uzoqdasiz (~${Math.round(distance)} metr). Faqat belgilangan hududda ishlash mumkin.`);
      }
      updateSubmitButton();
    }, (err) => {
      geoStatus.textContent = "🔴 GPS xatosi yoki ruxsat yo'q";
      geoStatus.style.background = "#fee2e2";
      alert("GPS ma'lumotini olish imkoni bo'lmadi.");
    }, { enableHighAccuracy: true, timeout: 15000 });
  }

  function updateSubmitButton() {
    const name = document.getElementById('student-name').value;
    const submitBtn = document.getElementById('btn-submit');
    if (name && faceVerified && geoVerified) {
      submitBtn.disabled = false;
    } else {
      submitBtn.disabled = true;
    }
  }

  document.getElementById('student-name').addEventListener('change', updateSubmitButton);

  function sendDataToTelegram() {
    const submitBtn = document.getElementById('btn-submit');
    submitBtn.disabled = true;
    submitBtn.textContent = "Yuborilmoqda...";

    const BOT_TOKEN = "8809519471:AAET3nE1E3uWnF50_A7W6iEedLpRBfxF83Q";
    const CHAT_ID = "5304624013";

    const name = document.getElementById('student-name').value;
    const pair = document.getElementById('lesson-pair').value;
    
    const messageText = `📊 *MTO 1-26 GURUH DAVOMATI*\n\n` +
                        `👤 *Talaba:* ${name}\n` +
                        `📚 *Dars:* ${pair}\n` +
                        `📍 *Lokatsiya:* [Google Maps](https://maps.google.com/?q=${coordsText})\n` +
                        `🕒 *Vaqt:* ${new Date().toLocaleString('uz-UZ', {timeZone: 'Asia/Tashkent'})}`;

    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("caption", messageText);
    formData.append("parse_mode", "Markdown");

    let apiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

    if (rawFileBlob) {
      formData.append("photo", rawFileBlob, "face.jpg");
      apiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
    } else {
      formData.append("text", messageText);
    }

    fetch(apiUrl, { method: "POST", body: formData })
    .then(res => {
      if (res.ok) {
        alert("Davomat Telegram guruhiga muvaffaqiyatli yuborildi!");
        tg.close();
      } else {
        return res.text().then(text => { throw new Error(text); });
      }
    })
    .catch(err => {
      alert("Yuborishda xatolik yuz berdi. Internetni tekshiring.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Tasdiqlash va Yuborish";
    });
  }
</script>
</body>
</html>
